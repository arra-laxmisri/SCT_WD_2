<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body style="background-color:  white">
    <center>
        <div class="container">
            <h2>Calculator</h2>
        <input type="text" id="display">
        <div class="Btns">
            <button class="btn" onclick="numberDisplay('1')">1</button>
            <button class="btn" onclick="numberDisplay('2')">2</button>
            <button class="btn" onclick="numberDisplay('3')">3</button>
            <button class="btns" onclick="numberDisplay('+')">+</button>
            <button class="btn" onclick="numberDisplay('4')">4</button>
            <button class="btn" onclick="numberDisplay('5')">5</button>
            <button class="btn" onclick="numberDisplay('6')">6</button>
            <button class="btns" onclick="numberDisplay('-')">-</button>
            <button class="btn" onclick="numberDisplay('7')">7</button>
            <button class="btn" onclick="numberDisplay('8')">8</button>
            <button class="btn" onclick="numberDisplay('9')">9</button>
            <button class="btns" onclick="numberDisplay('*')">*</button>
            <button class="btn" onclick="numberDisplay('0')">0</button>
            <button class="btn" onclick="numberDisplay('00')">00</button>
            <button class="btn" onclick="numberDisplay('.')">.</button>
            <button class="btns" onclick="numberDisplay('%')">%</button>
            <button class="btns" onclick="clearing()">C</button>
            <button class="btns" onclick="numberDisplay('/')">/</button>
            <button class="btns" onclick=" squareRoot()">√</button>
            <button class="btns" onclick="Result()">=</button>
        </div>
    </div>
    </center>
    <script>
        let displayItem=document.getElementById("display");
        function numberDisplay(input)
        {
            displayItem.value+=input;
        }
        function Result(){
            try{
                displayItem.value=eval(displayItem.value);
            }
            catch(error)
            {
                displayItem.value="Invalid";
            }
        }
        function clearing(){
            displayItem.value="";
        }
        function squareRoot() {
        let expression = document.getElementById("display").value;
        let result = eval(expression);
        document.getElementById("display").value = Math.sqrt(result);
        }
    </script>
</body>
</html>
